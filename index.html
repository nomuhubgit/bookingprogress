<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Booking Dashboard</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #f5f4ef; margin: 0; padding: 24px; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
  .list { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
  .card {
    background: #fff; border: 1px solid #e2e0d8; border-radius: 10px;
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .name { font-weight: 500; font-size: 15px; }
  .trip { color: #666; font-size: 13px; margin-top: 2px; }
  .time { color: #999; font-size: 12px; white-space: nowrap; margin-left: 12px; }
  .badge {
    display: inline-block; background: #e1f5ee; color: #04342c;
    font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-top: 4px;
  }
  .empty { color: #999; font-size: 14px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <h1>Live booking dashboard</h1>
  <div class="subtitle" id="status">Loading...</div>
  <div class="list" id="list"></div>

<script>
  const POLL_INTERVAL_MS = 5000; // check the sheet every 5 seconds
  let lastCount = 0;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function render(bookings) {
    const list = document.getElementById('list');
    if (!bookings.length) {
      list.innerHTML = '<div class="empty">Waiting for bookings...</div>';
      return;
    }
    list.innerHTML = bookings.map((b) => `
      <div class="card">
        <div>
          <div class="name">${escapeHtml(b.participantName)}</div>
          <div class="trip">${escapeHtml(b.tripName)}</div>
          <span class="badge">${escapeHtml(b.status)}</span>
        </div>
        <div class="time">${escapeHtml(b.time ? new Date(b.time).toLocaleTimeString() : '')}</div>
      </div>
    `).join('');
  }

  async function poll() {
    try {
      const res = await fetch('/api/bookings');
      const bookings = await res.json();
      document.getElementById('status').textContent =
        `Connected, checking for new bookings every ${POLL_INTERVAL_MS / 1000}s`;
      render(bookings);
      lastCount = bookings.length;
    } catch (err) {
      document.getElementById('status').textContent = 'Could not reach the server, retrying...';
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
